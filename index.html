<script>
  /* ========== TAB SYSTEM ========== */
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.page).classList.add('active');
    });
  });

  /* ========== KEYBOARD LAYOUTS ========== */
  const LAYOUTS = {
    qwerty: [
      "1234567890",
      "qwertyuiop",
      "asdfghjkl",
      "zxcvbnm"
    ],
    qwertz: [
      "1234567890",
      "qwertzuiop",
      "asdfghjkl",
      "yxcvbnm"
    ],
    azerty: [
      "1234567890",
      "azertyuiop",
      "qsdfghjklm",
      "wxcvbn"
    ],
    emoji_6x5: [
      "😀😁😂🤣😃",
      "😄😅😆😉😊",
      "😋😎😍😘🥰",
      "😗😙😚☺️🙂",
      "🤗🤩🤔🤨😐",
      "😑😶🙄😏😣"
    ],
    youtube_tv: [
      "abcdefg",
      "hijklmn",
      "opqrstu",
      "vwxyz01",
      "2345678",
      "9.!@#$%"
    ],
    xbox: [
      "1234567890",
      "qwertyuiop",
      "asdfghjkl",
      "zxcvbnm"
    ]
  };

  function findPos(layout, char) {
    const c = char.toLowerCase();
    for (let r = 0; r < layout.length; r++) {
      const col = layout[r].indexOf(c);
      if (col !== -1) return { r, c: col };
      const col2 = layout[r].indexOf(char);
      if (col2 !== -1) return { r, c: col2 };
    }
    return null;
  }

  function shortestMove(from, to, rows, cols, wrap) {
    let dr = to.r - from.r;
    let dc = to.c - from.c;
    if (wrap) {
      if (Math.abs(dr) > rows / 2) dr = dr > 0 ? dr - rows : dr + rows;
      if (Math.abs(dc) > cols / 2) dc = dc > 0 ? dc - cols : dc + cols;
    }
    const moves = [];
    const vDir = dr > 0 ? "Down" : "Up";
    const hDir = dc > 0 ? "Right" : "Left";
    for (let i = 0; i < Math.abs(dr); i++) moves.push(vDir);
    for (let i = 0; i < Math.abs(dc); i++) moves.push(hDir);
    return { moves, steps: moves.length, dr, dc };
  }

  function runTraversal() {
    const text = document.getElementById('inputText').value.trim();
    const layoutKey = document.getElementById('platformSelect').value;
    const wrap = document.getElementById('enableWrap').checked;
    const showPath = document.getElementById('showPath').checked;
    const layout = LAYOUTS[layoutKey];
    const out = document.getElementById('traversalOutput');
    const kb = document.getElementById('kbVisual');

    if (!text) {
      out.textContent = "Enter some text or emoji first.";
      document.getElementById('pillSteps').textContent = "0";
      document.getElementById('pillStart').textContent = "—";
      document.getElementById('pillEnd').textContent = "—";
      kb.style.display = "none";
      return;
    }

    const chars = Array.from(text);
    let totalSteps = 0;
    const lines = [];
    let prev = null;
    const hitSet = new Set();

    chars.forEach((ch, i) => {
      const pos = findPos(layout, ch);
      if (!pos) {
        lines.push(`[${i}] '${ch}' → not found on layout`);
        return;
      }
      hitSet.add(`${pos.r},${pos.c}`);
      if (prev) {
        const cols = Math.max(...layout.map(r => r.length));
        const { moves, steps } = shortestMove(prev, pos, layout.length, cols, wrap);
        totalSteps += steps;
        lines.push(`[${i}] '${ch}' @ [${pos.r},${pos.c}]  ← ${moves.join(" + ") || "stay"} (${steps})`);
      } else {
        lines.push(`[${i}] '${ch}' @ [${pos.r},${pos.c}]  (start)`);
      }
      prev = pos;
    });

    out.textContent = lines.join("\n") || "No valid characters found.";
    document.getElementById('pillSteps').textContent = totalSteps;
    document.getElementById('pillStart').textContent = chars[0] || "—";
    document.getElementById('pillEnd').textContent = chars[chars.length - 1] || "—";

    if (showPath) {
      kb.style.display = "grid";
      kb.innerHTML = "";
      layout.forEach((row, r) => {
        const rowEl = document.createElement("div");
        rowEl.className = "kb-row";
        [...row].forEach((key, c) => {
          const keyEl = document.createElement("div");
          keyEl.className = "kb-key";
          keyEl.textContent = key;
          if (hitSet.has(`${r},${c}`)) keyEl.classList.add("hit");
          rowEl.appendChild(keyEl);
        });
        kb.appendChild(rowEl);
      });
    } else {
      kb.style.display = "none";
    }
  }

  // Live update for Traversal
  document.getElementById('btnRun').addEventListener('click', runTraversal);
  ['inputText', 'platformSelect', 'enableWrap', 'showPath'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', runTraversal);
    el.addEventListener('change', runTraversal);
  });

  document.getElementById('btnCopyTraversal').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('traversalOutput').textContent);
  });

  document.getElementById('btnExportCSV').addEventListener('click', () => {
    const text = document.getElementById('traversalOutput').textContent;
    const blob = new Blob(
      ["step,detail\n" + text.split("\n").map((l, i) => `${i},"${l.replace(/"/g, '""')}"`).join("\n")],
      { type: "text/csv" }
    );
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "traversal.csv";
    a.click();
  });

  /* ========== CIPHER BLOCKS ========== */
  function processCipherBlocks() {
    const raw = document.getElementById('blockInput').value;
    const format = document.getElementById('baseFormat').value;
    const groupSize = parseInt(document.getElementById('groupSize').value, 10) || 5;
    const upper = document.getElementById('uppercaseOnly').checked;
    const alphaOnly = document.getElementById('alphaOnly').checked;
    const out = document.getElementById('blockOutput');
    const stats = document.getElementById('blockStats');

    if (!raw.trim()) {
      out.textContent = "Awaiting input…";
      stats.textContent = "Length: 0 · Groups: 0";
      return;
    }

    let processed = "";
    if (format === "binary") {
      processed = Array.from(raw).map(c => c.codePointAt(0).toString(2).padStart(8, "0")).join("");
    } else if (format === "hex") {
      processed = Array.from(raw).map(c => c.codePointAt(0).toString(16).padStart(2, "0")).join("");
    } else if (format === "octal") {
      processed = Array.from(raw).map(c => c.codePointAt(0).toString(8).padStart(3, "0")).join("");
    } else {
      processed = raw;
      if (alphaOnly) processed = processed.replace(/[^a-zA-Z0-9]/g, "");
      if (upper) processed = processed.toUpperCase();
    }

    const groups = processed.match(new RegExp(`.{1,${groupSize}}`, "g")) || [];
    out.textContent = groups.join(" ") || "No matching characters.";
    stats.textContent = `Length: ${processed.length} · Groups: ${groups.length} (size ${groupSize})`;
  }

  ["blockInput", "baseFormat", "groupSize", "uppercaseOnly", "alphaOnly"].forEach(id => {
    document.getElementById(id).addEventListener("input", processCipherBlocks);
    document.getElementById(id).addEventListener("change", processCipherBlocks);
  });

  document.getElementById("btnCopyBlocks").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("blockOutput").textContent);
  });

  /* ========== VERTICAL TEXT ========== */
  const kanaMap = {
    ka:"カ",ki:"キ",ku:"ク",ke:"ケ",ko:"コ",
    sa:"サ",shi:"シ",su:"ス",se:"セ",so:"ソ",
    ta:"タ",chi:"チ",tsu:"ツ",te:"テ",to:"ト",
    na:"ナ",ni:"ニ",nu:"ヌ",ne:"ネ",no:"ノ",
    ha:"ハ",hi:"ヒ",fu:"フ",he:"ヘ",ho:"ホ",
    ma:"マ",mi:"ミ",mu:"ム",me:"メ",mo:"モ",
    ya:"ヤ",yu:"ユ",yo:"ヨ",
    ra:"ラ",ri:"リ",ru:"ル",re:"レ",ro:"ロ",
    wa:"ワ",wo:"ヲ",n:"ン",
    a:"ア",i:"イ",u:"ウ",e:"エ",o:"オ"
  };

  function toKana(str) {
    let text = str.toLowerCase(), result = "", i = 0;
    while (i < text.length) {
      if (i + 3 <= text.length && kanaMap[text.slice(i, i + 3)]) {
        result += kanaMap[text.slice(i, i + 3)]; i += 3;
      } else if (i + 2 <= text.length && kanaMap[text.slice(i, i + 2)]) {
        result += kanaMap[text.slice(i, i + 2)]; i += 2;
      } else if (kanaMap[text[i]]) {
        result += kanaMap[text[i]]; i += 1;
      } else {
        result += text[i]; i += 1;
      }
    }
    return result;
  }

  function transposeVertical() {
    const input = document.getElementById("vertInput").value;
    const mode = document.getElementById("vertMode").value;
    const dir = document.getElementById("vertDirection").value;
    const el = document.getElementById("vertOutput");

    if (!input.trim()) {
      el.textContent = "縦書きプレビュー";
      return;
    }
    el.style.writingMode = dir === "rtl" ? "vertical-rl" : "vertical-lr";
    el.textContent = mode === "kana" ? toKana(input) : input;
  }

  ["vertInput", "vertMode", "vertDirection"].forEach(id => {
    document.getElementById(id).addEventListener("input", transposeVertical);
    document.getElementById(id).addEventListener("change", transposeVertical);
  });

  document.getElementById("btnCopyVert").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("vertOutput").textContent);
  });

  /* ========== AGENT DRAWER ========== */
  const agentBody = document.getElementById("agent-body");
  const agentToggle = document.getElementById("agent-toggle");
  document.getElementById("agent-header").addEventListener("click", () => {
    agentBody.classList.toggle("open");
    agentToggle.textContent = agentBody.classList.contains("open") ? "▼" : "▲";
  });

  function log(msg) {
    const el = document.getElementById("agent-log");
    el.textContent += "\n" + msg;
    el.scrollTop = el.scrollHeight;
  }

  document.getElementById("btnClearLog").addEventListener("click", () => {
    document.getElementById("agent-log").textContent = "Log cleared.";
  });

  document.getElementById("btnAudit").addEventListener("click", () => {
    const input = document.getElementById("inputText").value;
    const blocks = document.getElementById("blockInput").value;
    log(`Audit @ ${new Date().toLocaleTimeString()}`);
    log(`• Decoder input length: ${Array.from(input).length}`);
    log(`• Blocks input length: ${blocks.length}`);
    log(`• Active layout: ${document.getElementById("platformSelect").value}`);
    log(`• Wrap enabled: ${document.getElementById("enableWrap").checked}`);
  });

  document.getElementById("btnSolve").addEventListener("click", solveMath);
  document.getElementById("agentInput").addEventListener("keydown", e => {
    if (e.key === "Enter") solveMath();
  });

  function solveMath() {
    const expr = document.getElementById("agentInput").value.trim();
    if (!expr) return;
    try {
      let safe = expr
        .replace(/(\d+)\s*deg/gi, "($1*Math.PI/180)")
        .replace(/\^/g, "**")
        .replace(/sin/gi, "Math.sin")
        .replace(/cos/gi, "Math.cos")
        .replace(/tan/gi, "Math.tan")
        .replace(/sqrt/gi, "Math.sqrt")
        .replace(/pi/gi, "Math.PI")
        .replace(/0x([0-9a-f]+)/gi, (_, h) => parseInt(h, 16));

      if (!/^[\d\s+\-*/().,MathsincotaqrpPI]+$/.test(safe.replace(/\s/g, ""))) {
        throw new Error("Unsupported characters");
      }
      const result = Function(`"use strict"; return (${safe})`)();
      log(`> ${expr}  =  ${result}`);
    } catch (err) {
      log(`Error: ${err.message}`);
    }
  }

  // Initial run
  processCipherBlocks();
  transposeVertical();
  runTraversal();   // also run once on load
</script>
